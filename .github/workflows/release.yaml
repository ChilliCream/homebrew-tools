name: 🍺 Update Homebrew Tap

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to update to
        required: true
        type: string

run-name: "🍺 Update to ${{ inputs.version }}"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: 🔢 Parse major and derive flags
        id: ctx
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-p\.[0-9]+)?$ ]]; then
            echo "::error::Version '$VERSION' must be X.Y.Z or X.Y.Z-p.N"
            exit 1
          fi
          MAJOR="${VERSION%%.*}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_STABLE=true
          else
            IS_STABLE=false
          fi
          echo "MAJOR=$MAJOR" >> "$GITHUB_ENV"
          echo "IS_STABLE=$IS_STABLE" >> "$GITHUB_ENV"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"

      - name: ⬇️ Download release archives
        run: |
          set -euo pipefail
          BASE="https://github.com/ChilliCream/graphql-platform/releases/download/${VERSION}"
          curl -fL -o nitro-osx-arm64.zip "$BASE/nitro-osx-arm64.zip"
          curl -fL -o nitro-osx-x64.zip "$BASE/nitro-osx-x64.zip"
          curl -fL -o nitro-linux-arm64.tar.gz "$BASE/nitro-linux-arm64.tar.gz"
          curl -fL -o nitro-linux-x64.tar.gz "$BASE/nitro-linux-x64.tar.gz"

      - name: 🔢 Compute SHA256
        run: |
          {
            echo "SHA_OSX_ARM64=$(sha256sum nitro-osx-arm64.zip | cut -d' ' -f1)"
            echo "SHA_OSX_X64=$(sha256sum nitro-osx-x64.zip | cut -d' ' -f1)"
            echo "SHA_LINUX_ARM64=$(sha256sum nitro-linux-arm64.tar.gz | cut -d' ' -f1)"
            echo "SHA_LINUX_X64=$(sha256sum nitro-linux-x64.tar.gz | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: 📥 Checkout tap
        uses: actions/checkout@v6

      - name: 📝 Generate formulas
        id: formulas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Formula

          write_formula() {
            local name="$1"           # e.g. nitro-cli@17
            local livecheck_mode="$2" # none | latest | major
            local cls
            cls=$(perl -pe 's/^(.)/\U$1/; s/[-_.\s]([a-zA-Z0-9])/\U$1/g; y/+/x/; s/(.)\@(\d)/$1AT$2/' <<< "$name")
            local out="Formula/${name}.rb"

            local livecheck=""
            case "$livecheck_mode" in
              latest)
                livecheck=$'\n  livecheck do\n    url :stable\n    strategy :github_latest\n  end\n'
                ;;
              major)
                livecheck=$'\n  livecheck do\n    url :stable\n    strategy :github_releases\n    regex(/^('"${MAJOR}"$'\\.\\d+\\.\\d+)$/)\n  end\n'
                ;;
              none) ;;
              *)
                echo "::error::Unknown livecheck mode: ${livecheck_mode}"
                exit 1
                ;;
            esac

            cat > "$out" <<EOF
          class ${cls} < Formula
            desc "ChilliCream Nitro Command Line"
            homepage "https://chillicream.com"
            version "${VERSION}"
            license "MIT"
          ${livecheck}
            on_macos do
              on_arm do
                url "https://github.com/ChilliCream/graphql-platform/releases/download/${VERSION}/nitro-osx-arm64.zip"
                sha256 "${SHA_OSX_ARM64}"
              end
              on_intel do
                url "https://github.com/ChilliCream/graphql-platform/releases/download/${VERSION}/nitro-osx-x64.zip"
                sha256 "${SHA_OSX_X64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/ChilliCream/graphql-platform/releases/download/${VERSION}/nitro-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/ChilliCream/graphql-platform/releases/download/${VERSION}/nitro-linux-x64.tar.gz"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              bin.install "nitro"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/nitro --version")
            end
          end
          EOF
            echo "Wrote $out"
          }

          # X.Y.Z[-p.N] -> "X Y Z N"; stable sorts above its own prereleases.
          version_key() {
            local core="${1%%-p.*}" pre=999999999
            [[ "$1" == *-p.* ]] && pre="${1##*-p.}"
            echo "${core//./ } $pre"
          }

          # Forward-only: true if VERSION is greater than the formula's current version (or it doesn't exist).
          is_newer() {
            local file="Formula/$1.rb" current i
            [ -f "$file" ] || return 0
            current=$(sed -n 's/^ *version "\(.*\)"$/\1/p' "$file" | head -n1)
            [ -n "$current" ] || return 0
            local -a a=($(version_key "$VERSION")) b=($(version_key "$current"))
            for i in 0 1 2 3; do
              (( 10#${a[i]} > 10#${b[i]} )) && return 0
              (( 10#${a[i]} < 10#${b[i]} )) && return 1
            done
            return 1
          }

          WROTE_MAJOR=false
          WROTE_LATEST=false

          if [ "$IS_STABLE" = "true" ]; then
            write_formula "nitro-cli@${VERSION}" "none"
            if is_newer "nitro-cli@${MAJOR}"; then
              write_formula "nitro-cli@${MAJOR}" "major"
              WROTE_MAJOR=true
            fi
            if is_newer "nitro-cli"; then
              write_formula "nitro-cli" "latest"
              WROTE_LATEST=true
            fi
          elif is_newer "nitro-cli@preview"; then
            write_formula "nitro-cli@preview" "none"
          fi

          echo "wrote_major=$WROTE_MAJOR" >> "$GITHUB_OUTPUT"
          echo "wrote_latest=$WROTE_LATEST" >> "$GITHUB_OUTPUT"

      - name: 📤 Commit (verified)
        id: commit
        uses: ChilliCream/create-signed-commit@d84f4dbc5b941e36c5b6a81d631d7ebb2f26128a
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "🍺 Update nitro-cli to ${{ inputs.version }}"

      - name: 🏷️ Tag full version
        if: steps.commit.outputs.sha != ''
        uses: ChilliCream/create-signed-tag@305574048e9b917846aa93aa8b23ba258533dd7e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ inputs.version }}
          sha: ${{ steps.commit.outputs.sha }}
          force: "false"

      - name: 🏷️ Tag major version
        if: steps.commit.outputs.sha != '' && steps.formulas.outputs.wrote_major == 'true'
        uses: ChilliCream/create-signed-tag@305574048e9b917846aa93aa8b23ba258533dd7e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.ctx.outputs.major }}
          sha: ${{ steps.commit.outputs.sha }}

      - name: 🚀 Create GitHub release
        if: steps.commit.outputs.sha != '' && steps.ctx.outputs.is_stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WROTE_LATEST: ${{ steps.formulas.outputs.wrote_latest }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping creation."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --latest="$WROTE_LATEST" \
            --verify-tag
