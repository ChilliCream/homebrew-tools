name: 🍎 Update Cider formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: Cider version to update to (bare semver, e.g. 0.7.0).
        required: true
        type: string
      is_stable:
        description: Accepted for dispatch compatibility; ignored. Cider ships release packages only.
        required: true
        type: boolean

run-name: "🍎 Update cider to ${{ inputs.version }}"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: ⬇️ Download release archive
        run: |
          set -euo pipefail
          curl -fL -o cider-osx-arm64.zip \
            "https://github.com/ChilliCream/cider/releases/download/${VERSION}/cider-osx-arm64.zip"

      - name: 🔢 Compute SHA256
        run: |
          set -euo pipefail
          echo "SHA_OSX_ARM64=$(sha256sum cider-osx-arm64.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: 📥 Checkout tap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: 📝 Generate formula
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Formula

          write_formula() {
            local out="Formula/cider.rb"

            cat > "$out" <<EOF
          class Cider < Formula
            desc "Docker Engine API daemon on top of Apple container"
            homepage "https://github.com/ChilliCream/cider"
            url "https://github.com/ChilliCream/cider/releases/download/${VERSION}/cider-osx-arm64.zip"
            sha256 "${SHA_OSX_ARM64}"
            license "MIT"

            livecheck do
              url :stable
              strategy :github_latest
            end

            depends_on arch: :arm64
            depends_on "docker"
            depends_on "docker-compose"
            depends_on macos: :tahoe

            def install
              bin.install "cider"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/cider version")
            end
          end
          EOF
            echo "Wrote $out"
          }

          write_formula

      - name: 📤 Commit (verified)
        uses: ChilliCream/create-signed-commit@d84f4dbc5b941e36c5b6a81d631d7ebb2f26128a
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "🍎 Update cider to ${{ inputs.version }}"
